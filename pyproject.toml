[project]
name = "lost-and-found"
version = "0.1.0"
description = "Lost & Found Finder: workspace root for the Python services"
requires-python = ">=3.12,<3.14"
dependencies = ["lf-core", "lf-api", "lf-worker"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/core", "services/api", "services/worker"]

[tool.uv.sources]
lf-core = { workspace = true }
lf-api = { workspace = true }
lf-worker = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.22", "ruff>=0.8", "psutil>=6.0"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["services/core/tests", "services/api/tests", "services/worker/tests"]
markers = ["db: needs the PostGIS test database (TEST_DATABASE_URL)"]
# Starlette suggests the httpx2 package for its TestClient; httpx works and is what we test against.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"conftest.py" = ["S105", "S106"]
# stdlib-only seeding script; it only opens the fixed https Nominatim URL.
"scripts/geocode_places.py" = ["S310"]
# The prompt text is data; re-wrapping it would change what the model sees (and the benchmark).
"services/worker/src/lf_worker/ai/extraction.py" = ["E501"]
